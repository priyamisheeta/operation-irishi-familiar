name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Operation_Irishi_Familiar_PUBLIC_BUILD_v0.1.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q Operation_Irishi_Familiar_PUBLIC_BUILD_v0.1.zip -d project

      - name: Repair Android build configuration
        run: |
          cat > project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.1" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.4.10" apply false
          }
          EOF

          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.operationirishi.familiar"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.operationirishi.familiar"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.04.01")

              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Fix GateActivity Kotlin return
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "project/app/src/main/java/"
              "com/operationirishi/familiar/GateActivity.kt"
          )

          s = p.read_text()

          old = """                            setResult(Activity.RESULT_OK)
                            finish()
                        } else {"""

          new = """                            setResult(Activity.RESULT_OK)
                            finish()
                            null
                        } else {"""

          if old not in s:
              raise SystemExit(
                  "ERROR: Could not find GateActivity patch target"
              )

          p.write_text(s.replace(old, new, 1))

          print("GateActivity patched successfully.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: project
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Operation-Irishi-Familiar-v0.1-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
